[project]
name = "tempest-core"
version = "0.4.0"
description = "Renderer-agnostic UI core (IR, reconciler, state, style, widgets) shared by tempestroid and tempestweb."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mauricio Benjamin", email = "mauricio.benjamin@reloverelations.com" }]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# Bilingual MkDocs documentation site (PT-BR default + EN-US under /en/).
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "mkdocstrings[python]>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tempest_core"]

# Mirror tempestroid's gate (this is tempestroid's renderer-agnostic core).
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "Q", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
