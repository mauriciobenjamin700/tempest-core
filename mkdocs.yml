site_name: tempest-core
site_description: >-
  O core de UI agnóstico de renderizador — IR, reconciliador, estado, estilo e
  widgets — compartilhado pelo tempestroid e pelo tempestweb.
site_author: Mauricio Benjamin
site_url: https://mauriciobenjamin700.github.io/tempest-core/
repo_url: https://github.com/mauriciobenjamin700/tempest-core
repo_name: mauriciobenjamin700/tempest-core
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mauricio Benjamin — MIT License

# Build hooks (core MkDocs, no extra dependency). llms_txt generates
# llms.txt + llms-full.txt at the site root (llmstxt.org convention) for AIs/LLMs.
hooks:
  - docs/hooks/llms_txt.py

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Mudar para o modo claro
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - pt
        - en
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt
          default: true
          name: Português (Brasil)
          build: true
          site_name: tempest-core
          nav_translations:
            Home: Início
            Installation: Instalação
            Tutorial: Tutorial
            "Tutorial — build & diff": "Tutorial — build & diff"
            "1. State and rebuilds": "1. Estado e rebuilds"
            "2. Styling": "2. Estilo"
            "3. Design system": "3. Design system"
            "Component gallery": "Galeria de componentes"
            "Text": "Texto"
            "Buttons": "Botões"
            "Layout & structure": "Layout e estrutura"
            "Inputs": "Inputs"
            "Forms": "Formulários"
            "Selection": "Seleção"
            "Media & Canvas": "Mídia & Canvas"
            "Indicators & lists": "Indicadores & listas"
            "Overlays": "Overlays"
            "Animation & gestures": "Animação & gestos"
            "Navigation": "Navegação"
            "Surfaces & cards": "Superfícies & cards"
            "Feedback": "Feedback"
            "Dates & disclosure": "Datas & disclosure"
            "Tables": "Tabelas"
            "BR forms & pickers": "Formulários BR & seletores"
            "Research": "Pesquisa"
            "Events & handlers": "Eventos & handlers"
            "API reference": "Referência da API"
        - locale: en
          name: English (US)
          build: true
          site_name: tempest-core
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mauriciobenjamin700/tempest-core

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorial:
      - "Tutorial — build & diff": tutorial/index.md
      - "1. State and rebuilds": tutorial/state.md
      - "2. Styling": tutorial/style.md
      - "3. Design system": tutorial/design-system.md
  - Component gallery:
      - "Text": gallery/text.md
      - "Buttons": gallery/buttons.md
      - "Layout & structure": gallery/layout.md
      - "Inputs": gallery/inputs.md
      - "Forms": gallery/forms.md
      - "Selection": gallery/selection.md
      - "Media & Canvas": gallery/media.md
      - "Indicators & lists": gallery/indicators-lists.md
      - "Overlays": gallery/overlays.md
      - "Animation & gestures": gallery/animation-gestures.md
      - "Navigation": gallery/navigation.md
      - "Surfaces & cards": gallery/surfaces-cards.md
      - "Feedback": gallery/feedback.md
      - "Dates & disclosure": gallery/dates-disclosure.md
      - "Tables": gallery/tables.md
      - "BR forms & pickers": gallery/br-forms-pickers.md
      - "Research": gallery/research.md
      - "Events & handlers": gallery/events.md
  - API reference: reference.md
